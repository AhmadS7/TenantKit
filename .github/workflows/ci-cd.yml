name: TenantKit Quality & CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate-pipeline:
    name: Monorepo Automated Quality Gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tenantkit
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 1. Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 2. Type Check
        run: pnpm run typecheck

      - name: 3. Lint Codebase
        run: pnpm run lint

      - name: 4. Engineering Quality Metrics & Static Analysis
        run: pnpm run quality

      - name: 5. Backend Unit & Integration Tests
        run: pnpm test

      - name: 6. BDD Feature Tests
        run: pnpm run test:bdd

      - name: 7. Backend E2E Tests
        env:
          DB_PASSWORD: postgres
        run: pnpm run test:e2e

      - name: 8. Frontend Quality & Component Tests
        working-directory: ./frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm test

      - name: 9. Production Build Verification
        run: |
          pnpm run build
          cd frontend && pnpm run build
